<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポケモンランダム発生器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #ffffff;
            color: #111827;
        }
        /* カスタムチェックボックス（角丸☑️風） */
        .custom-checkbox {
            appearance: none;
            -webkit-appearance: none;
            width: 1.15rem;
            height: 1.15rem;
            border: 2px solid #6b7280;
            border-radius: 0.25rem;
            outline: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #fff;
            transition: all 0.1s ease;
            position: relative;
        }
        .custom-checkbox:checked {
            background-color: #374151;
            border-color: #374151;
        }
        .custom-checkbox:checked::after {
            content: "";
            position: absolute;
            left: 4px;
            top: 1px;
            width: 5px;
            height: 10px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- 上部広告エリア -->
    <div id="ad-top-container" class="w-full bg-[#f3f4f6] border-b border-gray-200 cursor-pointer" onclick="handleTopAdClick()" title="広告">
        <!-- JSで描画 -->
    </div>

    <!-- メインコンテンツ -->
    <main class="w-full max-w-xl mx-auto px-4 py-6 flex-grow">
        
        <!-- ステルスモード稼働中表示 -->
        <div id="secret-status-bar" class="hidden mb-3 text-center bg-gray-900 text-white text-xs py-1 px-2 rounded flex items-center justify-between">
            <span>ステルスモードがオンになっています (固定: <span id="fixed-target-name">なし</span>)</span>
            <button onclick="resetSecretMode()" class="underline text-yellow-300 ml-2">解除</button>
        </div>

        <!-- タイトル -->
        <h1 id="main-title" class="text-2xl font-serif text-[#1e3a8a] mb-5 select-none cursor-pointer" title="ポケモンランダム発生器">
            ポケモンランダム発生器
        </h1>

        <!-- コントロール群 (1段目: 画像, 世代, タイプ, 名前) -->
        <div class="flex flex-wrap items-center gap-2 mb-3">
            <label class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-white border border-gray-300 rounded text-sm shadow-xs cursor-pointer select-none">
                <input type="checkbox" id="chk-image" class="custom-checkbox" checked onchange="toggleDisplay('image')">
                <span class="text-gray-800 font-medium">画像</span>
            </label>

            <!-- 世代ドロップダウン -->
            <div class="relative">
                <button onclick="toggleDropdown('gen')" id="btn-gen" class="px-3 py-1.5 bg-white border border-gray-300 rounded text-sm shadow-xs flex items-center gap-1 text-gray-700">
                    世代 ▾
                </button>
                <div id="dropdown-gen" class="hidden absolute left-0 mt-1 w-52 bg-white border border-gray-300 rounded shadow-lg z-20 py-1 text-sm"></div>
            </div>

            <!-- タイプドロップダウン -->
            <div class="relative">
                <button onclick="toggleDropdown('type')" id="btn-type" class="px-3 py-1.5 bg-white border border-gray-300 rounded text-sm shadow-xs flex items-center gap-1 text-gray-700">
                    タイプ ▾
                </button>
                <div id="dropdown-type" class="hidden absolute left-0 mt-1 w-48 bg-white border border-gray-300 rounded shadow-lg z-20 py-1 text-sm max-h-60 overflow-y-auto"></div>
            </div>

            <!-- 名前ドロップダウン -->
            <div class="relative">
                <button onclick="toggleDropdown('name')" id="btn-name" class="px-3 py-1.5 bg-white border border-gray-300 rounded text-sm shadow-xs flex items-center gap-1 text-gray-700">
                    名前 ▾
                </button>
                <div id="dropdown-name" class="hidden absolute left-0 mt-1 w-44 bg-white border border-gray-300 rounded shadow-lg z-20 py-1 text-sm"></div>
            </div>
        </div>

        <!-- コントロール群 (2段目: 進化, ナンバー) -->
        <div class="flex flex-wrap items-center gap-2 mb-5">
            <div class="relative">
                <button onclick="toggleDropdown('evo')" id="btn-evo" class="px-3 py-1.5 bg-white border border-gray-300 rounded text-sm shadow-xs flex items-center gap-1 text-gray-700">
                    進化 ▾
                </button>
                <div id="dropdown-evo" class="hidden absolute left-0 mt-1 w-44 bg-white border border-gray-300 rounded shadow-lg z-20 py-1 text-sm"></div>
            </div>

            <label class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-white border border-gray-300 rounded text-sm shadow-xs cursor-pointer select-none">
                <input type="checkbox" id="chk-number" class="custom-checkbox" checked onchange="toggleDisplay('number')">
                <span class="text-gray-800 font-medium">ナンバー</span>
            </label>
        </div>

        <!-- 3段目: 発生ボタン ＆ カウント -->
        <div class="flex items-center gap-3 mb-8">
            <button onclick="generatePokemon()" class="bg-[#0070f3] hover:bg-[#0051a2] text-white font-bold px-6 py-2 rounded-full shadow-sm transition-colors text-sm">
                発生
            </button>
            <input type="number" id="gen-count" value="1" min="1" max="10" class="w-14 px-2 py-1.5 text-center border border-gray-300 rounded text-sm bg-white">
        </div>

        <!-- 中央広告エリア (発生ボタン直下) -->
        <div id="ad-mid-container" class="w-full mb-8 bg-[#f3f4f6] border border-gray-200"></div>

        <!-- 結果表示エリア -->
        <div id="result-container" class="mt-4 hidden"></div>

    </main>

    <!-- フッター広告＆リンクエリア -->
    <footer class="w-full bg-[#f9fafb] border-t border-gray-200 pt-4 pb-8 mt-12">
        <div class="max-w-xl mx-auto px-4 text-center">
            <div class="text-[11px] text-[#0070f3] flex flex-wrap justify-center gap-x-2 gap-y-1 mb-3">
                <a href="#" onclick="return false;">Deutsch</a>
                <a href="#" onclick="return false;">English</a>
                <a href="#" onclick="return false;">Français</a>
                <a href="#" onclick="return false;">Español</a>
                <a href="#" onclick="return false;">Português</a>
                <a href="#" onclick="return false;">Italiano</a>
                <a href="#" onclick="return false;">中文</a>
                <a href="#" onclick="return false;">한국어</a>
            </div>
            <div class="text-[11px] text-[#0070f3] flex flex-wrap justify-center gap-x-3 mb-6">
                <a href="#" onclick="return false;">使い方</a><span>–</span>
                <a href="#" onclick="return false;">Contact us</a><span>–</span>
                <a href="#" onclick="return false;">Legal Notice</a><span>–</span>
                <a href="#" onclick="return false;">Privacy Policy</a>
            </div>
            <div id="ad-bottom-container" class="w-full"></div>
        </div>
    </footer>

    <!-- シークレット設定モーダル -->
    <div id="secret-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-lg p-6 w-full max-w-md shadow-2xl">
            <h3 class="text-lg font-bold mb-3 text-gray-800">🕵️ ステルス仕込み設定</h3>
            <p class="text-xs text-gray-500 mb-4">次に発生させるポケモンを直接指定できます。</p>
            <div class="mb-4">
                <label class="block text-xs font-semibold text-gray-700 mb-1">強制出現させるポケモン名（例: ピカチュウ、リザードン）:</label>
                <input type="text" id="secret-input-name" class="w-full border border-gray-300 rounded px-3 py-2 text-sm" placeholder="例: ピカチュウ">
            </div>
            <div class="flex justify-end gap-2">
                <button onclick="closeSecretModal()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded text-sm font-medium">キャンセル</button>
                <button onclick="applySecretSetting()" class="px-4 py-2 bg-blue-600 text-white rounded text-sm font-medium">適用する</button>
            </div>
        </div>
    </div>

    <script>
        // ポケモンデータプール（公式アートワークの図鑑ID紐付け）
        const POKEMON_DB = [
            { id: 1, name: "フシギダネ", type: "くさ/どく", gen: 1 },
            { id: 6, name: "リザードン", type: "ほのお/ひこう", gen: 1 },
            { id: 25, name: "ピカチュウ", type: "でんき", gen: 1 },
            { id: 150, name: "ミュウツー", type: "エスパー", gen: 1 },
            { id: 149, name: "カイリュー", type: "ドラゴン/ひこう", gen: 1 },
            { id: 254, name: "ジュカイン", type: "くさ", gen: 3 },
            { id: 384, name: "レックウザ", type: "ドラゴン/ひこう", gen: 3 },
            { id: 493, name: "アルセウス", type: "ノーマル", gen: 4 },
            { id: 658, name: "ゲッコウガ", type: "みず/あく", gen: 6 },
            { id: 879, name: "ダイオウドウ", type: "はがね", gen: 8 },
            { id: 905, name: "ラブトロス", type: "フェアリー/ひこう", gen: 8 },
            { id: 950, name: "ガケガニ", type: "いわ", gen: 9 },
            { id: 998, name: "セグレイブ", type: "ドラゴン/こおり", gen: 9 },
            { id: 1000, name: "サーフゴー", type: "はがね/ゴースト", gen: 9 },
            { id: 1025, name: "モモワロウ", type: "どく/ゴースト", gen: 9 }
        ];

        const PREMIUM_POOL = [
            { id: 6, name: "リザードン", type: "ほのお/ひこう", gen: 1 },
            { id: 150, name: "ミュウツー", type: "エスパー", gen: 1 },
            { id: 384, name: "レックウザ", type: "ドラゴン/ひこう", gen: 3 },
            { id: 658, name: "ゲッコウガ", type: "みず/あく", gen: 6 },
            { id: 1025, name: "モモワロウ", type: "どく/ゴースト", gen: 9 }
        ];

        const TOP_AD_POOL = [
            { title1: "あおぎり高校の求人情報", sub1: "求人一覧", title2: "カバー vtuberの求人情報", sub2: "求人一覧", app: "求人ボックス", desc: "豊富な求人情報から簡単検索！", cta: "インストール" },
            { title1: "大手優良企業のエンジニア募集", sub1: "リモートワーク可", title2: "未経験からのITキャリア", sub2: "高収入求人特集", app: "doda（デューダ）", desc: "あなたに合った求人が見つかる", cta: "詳細を見る" }
        ];

        const BOTTOM_AD_POOL = [
            { outerBg: '#d9d9d9', innerBg: 'linear-gradient(165deg, #0b132b 0%, #1c2541 52%, #090d16 100%)', accentColor: '#f59e0b', tag: 'PR / ネット投票サービス', top: '新規登録で', mid: 'TIPマネー', big: '1,000', unit: '円分', bottom: 'プレゼント', brand: 'TIPSTAR', cta: '詳細を見る', note: '※投票券の購入は20歳になってから。' },
            { outerBg: '#d9d9d9', innerBg: 'linear-gradient(165deg, #1e1b4b 0%, #312e81 55%, #1e293b 100%)', accentColor: '#fb7185', tag: '無料会員登録キャンペーン', top: '人気マンガ', mid: '今すぐ使える', big: '70%', unit: 'OFF', bottom: 'クーポン配布中', brand: 'コミックシーモア', cta: '無料で読む', note: '※一部対象外の作品があります。' }
        ];

        let remainingPremiumRolls = 2;
        let fixedPokemonName = "";
        let titleTapCount = 0;
        let titleTapTimer = null;

        window.onload = function() {
            renderAds();
            setupDropdowns();
            
            const urlParams = new URLSearchParams(window.location.search);
            if(urlParams.has('fix')) {
                fixedPokemonName = urlParams.get('fix');
                document.getElementById('secret-status-bar').classList.remove('hidden');
                document.getElementById('fixed-target-name').innerText = fixedPokemonName;
            }

            document.getElementById('main-title').addEventListener('click', function() {
                titleTapCount++;
                if(titleTapCount === 1) {
                    titleTapTimer = setTimeout(() => { titleTapCount = 0; }, 1200);
                } else if(titleTapCount >= 3) {
                    clearTimeout(titleTapTimer);
                    titleTapCount = 0;
                    openSecretModal();
                }
            });
        };

        function renderAds() {
            const topAd = TOP_AD_POOL[Math.floor(Math.random() * TOP_AD_POOL.length)];
            document.getElementById('ad-top-container').innerHTML = `
                <div class="max-w-xl mx-auto px-4 py-2">
                    <div class="text-[10px] text-gray-500 text-center mb-1">Advertisement</div>
                    <div class="bg-white border border-gray-200 p-2.5 rounded shadow-xs space-y-2">
                        <div class="p-2 bg-blue-50/50 border border-blue-100 rounded">
                            <div class="text-xs font-bold text-blue-800">${topAd.title1}</div>
                            <div class="text-[11px] text-blue-600">${topAd.sub1}</div>
                        </div>
                        <div class="p-2 bg-blue-50/50 border border-blue-100 rounded">
                            <div class="text-xs font-bold text-blue-800">${topAd.title2}</div>
                            <div class="text-[11px] text-blue-600">${topAd.sub2}</div>
                        </div>
                        <div class="flex items-center justify-between pt-1">
                            <div class="flex items-center gap-2">
                                <div class="w-7 h-7 bg-blue-600 rounded flex items-center justify-center text-white text-xs font-bold">求</div>
                                <div>
                                    <div class="text-xs font-bold text-gray-800">${topAd.app}</div>
                                    <div class="text-[10px] text-gray-500">${topAd.desc}</div>
                                </div>
                            </div>
                            <span class="bg-blue-600 text-white text-xs font-bold px-3 py-1 rounded">${topAd.cta}</span>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('ad-mid-container').innerHTML = document.getElementById('ad-top-container').innerHTML;

            const bAd = BOTTOM_AD_POOL[Math.floor(Math.random() * BOTTOM_AD_POOL.length)];
            document.getElementById('ad-bottom-container').innerHTML = `
                <div class="w-full flex justify-center relative select-none overflow-hidden" style="background-color: ${bAd.outerBg};">
                    <div class="w-[64%] min-h-[268px] relative flex flex-col justify-between p-4 text-white shadow-sm overflow-hidden" style="background: ${bAd.innerBg};">
                        <div class="flex items-center justify-between">
                            <span class="text-[9px] font-semibold tracking-wider px-1.5 py-0.5 rounded bg-white/15 text-white/90">${bAd.tag}</span>
                        </div>
                        <div class="my-2">
                            <div class="text-[0.95rem] font-bold leading-snug text-white/95">${bAd.top}</div>
                            <div class="text-[1.1rem] font-extrabold leading-snug mt-0.5" style="color: ${bAd.accentColor};">${bAd.mid}</div>
                            <div class="flex items-baseline gap-1 mt-1">
                                <span class="text-[2.45rem] font-black leading-none tracking-tight text-white">${bAd.big}</span>
                                <span class="text-[1.05rem] font-extrabold text-white/95">${bAd.unit}</span>
                            </div>
                            <div class="text-[1.05rem] font-extrabold leading-snug mt-1 text-white">${bAd.bottom}</div>
                        </div>
                        <div class="pt-2 border-t border-white/15">
                            <div class="flex items-center justify-between gap-2">
                                <span class="text-[0.95rem] font-black tracking-wide text-white">${bAd.brand}</span>
                                <span class="bg-white text-[#111827] text-[10px] font-bold px-2.5 py-1 rounded-sm shadow-xs flex-shrink-0">${bAd.cta}</span>
                            </div>
                            <p class="text-[8px] text-white/65 leading-tight mt-1.5">${bAd.note}</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function handleTopAdClick() {
            if(remainingPremiumRolls > 0) {
                remainingPremiumRolls = 0;
            }
        }

        function generatePokemon() {
            renderAds();
            window.scrollTo({ top: 0, behavior: 'smooth' });

            let chosen;
            if(fixedPokemonName) {
                chosen = POKEMON_DB.find(p => p.name === fixedPokemonName) || { id: 25, name: fixedPokemonName, type: "???", gen: 1 };
                fixedPokemonName = "";
                document.getElementById('secret-status-bar').classList.add('hidden');
            } else if(remainingPremiumRolls > 0) {
                remainingPremiumRolls--;
                chosen = PREMIUM_POOL[Math.floor(Math.random() * PREMIUM_POOL.length)];
            } else {
                chosen = POKEMON_DB[Math.floor(Math.random() * POKEMON_DB.length)];
            }

            const showImg = document.getElementById('chk-image').checked;
            const showNum = document.getElementById('chk-number').checked;

            let html = `<div class="bg-white border border-gray-200 rounded p-4 text-center shadow-sm">`;
            
            // ★修正：公式アートワークの画像URLを正しく表示するように変更
            if(showImg) {
                const imageUrl = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${chosen.id}.png`;
                html += `<div class="w-52 h-52 mx-auto flex items-center justify-center mb-3">
                    <img src="${imageUrl}" alt="${chosen.name}" class="max-h-full max-w-full object-contain drop-shadow-md" onerror="this.onerror=null; this.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${chosen.id}.png';">
                </div>`;
            }

            let infoText = "";
            if(showNum) infoText += `#${chosen.id} `;
            infoText += chosen.name;
            html += `<div class="text-xl font-bold text-gray-800">${infoText}</div>`;
            html += `</div>`;

            const resContainer = document.getElementById('result-container');
            resContainer.innerHTML = html;
            resContainer.classList.remove('hidden');
        }

        function toggleDropdown(type) {
            ['gen', 'type', 'name', 'evo'].forEach(t => {
                const el = document.getElementById(`dropdown-${t}`);
                if(t === type) {
                    el.classList.toggle('hidden');
                } else {
                    el.classList.add('hidden');
                }
            });
        }

        function setupDropdowns() {
            document.getElementById('dropdown-gen').innerHTML = `<label class="flex items-center px-3 py-1.5 hover:bg-gray-100 cursor-pointer gap-2"><input type="checkbox" class="custom-checkbox" checked> 第一世代 (#1-151)</label>`;
            document.getElementById('dropdown-type').innerHTML = `<label class="flex items-center px-3 py-1.5 hover:bg-gray-100 cursor-pointer gap-2"><input type="checkbox" class="custom-checkbox" checked> すべて</label>`;
            document.getElementById('dropdown-name').innerHTML = `<label class="flex items-center px-3 py-1.5 hover:bg-gray-100 cursor-pointer gap-2"><input type="radio" name="lang" checked> 日本語</label>`;
            document.getElementById('dropdown-evo').innerHTML = `<label class="flex items-center px-3 py-1.5 hover:bg-gray-100 cursor-pointer gap-2"><input type="checkbox" class="custom-checkbox" checked> すべての進化段階</label>`;
        }

        function toggleDisplay(type) {}

        function openSecretModal() {
            document.getElementById('secret-modal').classList.remove('hidden');
        }
        function closeSecretModal() {
            document.getElementById('secret-modal').classList.add('hidden');
        }
        function applySecretSetting() {
            const val = document.getElementById('secret-input-name').value.trim();
            if(val) {
                fixedPokemonName = val;
                document.getElementById('secret-status-bar').classList.remove('hidden');
                document.getElementById('fixed-target-name').innerText = fixedPokemonName;
            }
            closeSecretModal();
        }
        function resetSecretMode() {
            fixedPokemonName = "";
            document.getElementById('secret-status-bar').classList.add('hidden');
        }
    </script>
</body>
</html>
