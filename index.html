<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ポケモンランダム発生器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #ffffff;
      color: #333333;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      margin: 0;
      padding: 0;
    }

    /* クラシック明朝体ブルータイトル */
    .zp-title {
      font-family: "Hiragino Mincho ProN", "YuMincho", "Yu Mincho", "Noto Serif JP", Georgia, serif;
      color: #2b6cb0;
      font-size: 26px;
      font-weight: 500;
      letter-spacing: 0.01em;
      line-height: 1.3;
      user-select: none;
    }

    /* 角丸四角チェックボックス（☑️ 形状） */
    .zp-checkbox {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 4px;
      border: 1.5px solid #9e9e9e;
      background-color: #ffffff;
      transition: background-color 0.12s ease, border-color 0.12s ease;
      flex-shrink: 0;
    }

    .zp-checkbox.checked {
      background-color: #5a5a5a;
      border-color: #5a5a5a;
    }

    .zp-checkbox svg {
      width: 12px;
      height: 12px;
      stroke: #ffffff;
      stroke-width: 2.6;
      fill: none;
      opacity: 0;
    }

    .zp-checkbox.checked svg {
      opacity: 1;
    }

    /* ドロップダウンボタン */
    .zp-dropdown-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background-color: #ffffff;
      border: 1px solid #d4d4d4;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.92rem;
      color: #333333;
      cursor: pointer;
      line-height: 1.3;
      transition: background-color 0.12s ease;
    }

    .zp-dropdown-btn.open {
      background-color: #d6d6d6;
      border-color: #bdbdbd;
    }

    /* フローティングドロップダウンメニュー */
    .zp-popover {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      background-color: #ffffff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.14);
      padding: 8px 6px;
      z-index: 60;
      min-width: 215px;
      max-height: 360px;
      overflow-y: auto;
    }

    .zp-popover-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 10px;
      border-radius: 5px;
      font-size: 0.92rem;
      color: #333333;
      cursor: pointer;
      white-space: nowrap;
      user-select: none;
    }

    .zp-popover-item:hover,
    .zp-popover-item:active {
      background-color: #f3f4f6;
    }

    /* 青色のピル型「発生」ボタン */
    .zp-generate-btn {
      background-color: #007bff;
      color: #ffffff;
      border: none;
      border-radius: 9999px;
      padding: 9px 24px;
      font-size: 0.96rem;
      font-weight: 700;
      cursor: pointer;
      line-height: 1.2;
      transition: background-color 0.15s ease, transform 0.08s ease;
    }

    .zp-generate-btn:active {
      background-color: #0062cc;
      transform: scale(0.97);
    }

    .zp-generate-btn:disabled {
      opacity: 0.85;
      cursor: not-allowed;
    }

    /* 発生数入力ボックス */
    .zp-count-input {
      width: 46px;
      height: 36px;
      border: 1px solid #d4d4d4;
      border-radius: 6px;
      text-align: center;
      font-size: 0.95rem;
      color: #333333;
      background-color: #ffffff;
      outline: none;
    }

    /* 広告スロット（上・中・下） */
    .ad-slot-top {
      width: 100%;
      min-height: 252px;
      margin-bottom: 18px;
      transition: opacity 0.14s ease;
      cursor: pointer;
    }

    .ad-slot-center {
      width: 100%;
      min-height: 268px;
      margin-top: 24px;
      margin-bottom: 72px;
      transition: opacity 0.14s ease;
    }

    .ad-slot-bottom {
      width: 100%;
      min-height: 268px;
      margin-top: 20px;
      transition: opacity 0.14s ease;
    }

    .ad-reloading {
      opacity: 0;
    }

    .zp-footer-link {
      color: #1a73e8;
      text-decoration: none;
      cursor: pointer;
    }
    .zp-footer-link:hover {
      text-decoration: underline;
    }

    /* タイプバッジ */
    .type-pill {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      color: #ffffff;
    }
    .type-normal   { background-color: #9fa19f; }
    .type-fire     { background-color: #e62829; }
    .type-water    { background-color: #2980ef; }
    .type-electric { background-color: #fac000; color: #222222; }
    .type-grass    { background-color: #3fa129; }
    .type-ice      { background-color: #3dcef3; color: #222222; }
    .type-fighting { background-color: #ff8000; }
    .type-poison   { background-color: #9141cb; }
    .type-ground   { background-color: #915121; }
    .type-flying   { background-color: #81b9ef; color: #222222; }
    .type-psychic  { background-color: #ef4179; }
    .type-bug      { background-color: #91a119; }
    .type-rock     { background-color: #afa981; }
    .type-ghost    { background-color: #704170; }
    .type-dragon   { background-color: #5060e1; }
    .type-dark     { background-color: #624d4e; }
    .type-steel    { background-color: #60a1b8; }
    .type-fairy    { background-color: #ef70ef; }

    @keyframes resultReveal {
      from { opacity: 0; transform: translateY(5px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .result-reveal {
      animation: resultReveal 0.16s ease-out forwards;
    }
  </style>
</head>
<body class="min-h-screen bg-white text-[#333333]">

  <!-- メインコンテナ（モバイル最適幅 440px） -->
  <div class="max-w-[440px] mx-auto px-4 pt-3 pb-16">

    <!-- 1. トップ広告スロット（タップでデフォルト2回仕込みを無言解除） -->
    <div id="ad-top" class="ad-slot-top"></div>

    <!-- 2. タイトル（3回連続タップ or 1.2秒長押しで仕込み起動） -->
    <header class="mb-4">
      <h1 id="secret-title-trigger" class="zp-title cursor-pointer">ポケモンランダム発生器</h1>
    </header>

    <!-- 3. フィルター＆コントロールバー -->
    <section class="space-y-3.5 select-none">

      <!-- 1段目: 画像チェック + 世代 + タイプ + 名前 -->
      <div class="flex flex-wrap items-center gap-2">
        <button type="button" id="btn-opt-image" class="inline-flex items-center gap-1.5 mr-1 cursor-pointer bg-transparent border-0 p-0 text-[0.94rem] text-[#333333]">
          <span id="cb-image" class="zp-checkbox checked">
            <svg viewBox="0 0 12 12"><polyline points="2.2,6.2 5,9 9.8,3.2"/></svg>
          </span>
          <span>画像</span>
        </button>

        <!-- 世代ドロップダウン -->
        <div class="relative" id="wrap-gen">
          <button type="button" id="btn-gen" class="zp-dropdown-btn">
            <span>世代</span>
            <span class="text-[10px]">▾</span>
          </button>
          <div id="menu-gen" class="zp-popover hidden">
            <div id="list-gen"></div>
            <div class="border-t border-gray-200 my-1"></div>
            <div id="btn-gen-all" class="zp-popover-item">
              <span id="cb-gen-all" class="zp-checkbox checked">
                <svg viewBox="0 0 12 12"><polyline points="2.2,6.2 5,9 9.8,3.2"/></svg>
              </span>
              <span>全選択/全解除</span>
            </div>
          </div>
        </div>

        <!-- タイプドロップダウン -->
        <div class="relative" id="wrap-type">
          <button type="button" id="btn-type" class="zp-dropdown-btn">
            <span>タイプ</span>
            <span class="text-[10px]">▾</span>
          </button>
          <div id="menu-type" class="zp-popover hidden">
            <div id="list-type"></div>
            <div class="border-t border-gray-200 my-1"></div>
            <div id="btn-type-all" class="zp-popover-item">
              <span id="cb-type-all" class="zp-checkbox checked">
                <svg viewBox="0 0 12 12"><polyline points="2.2,6.2 5,9 9.8,3.2"/></svg>
              </span>
              <span>全選択/全解除</span>
            </div>
          </div>
        </div>

        <!-- 名前言語ドロップダウン -->
        <div class="relative" id="wrap-name">
          <button type="button" id="btn-name" class="zp-dropdown-btn">
            <span>名前</span>
            <span class="text-[10px]">▾</span>
          </button>
          <div id="menu-name" class="zp-popover hidden" style="right: 0; left: auto; min-width: 155px;">
            <div id="list-name"></div>
          </div>
        </div>
      </div>

      <!-- 2段目: 進化 + ナンバーチェック -->
      <div class="flex items-center gap-3">
        <div class="relative" id="wrap-evo">
          <button type="button" id="btn-evo" class="zp-dropdown-btn">
            <span>進化</span>
            <span class="text-[10px]">▾</span>
          </button>
          <div id="menu-evo" class="zp-popover hidden" style="min-width: 165px;">
            <div id="list-evo"></div>
          </div>
        </div>

        <button type="button" id="btn-opt-number" class="inline-flex items-center gap-1.5 cursor-pointer bg-transparent border-0 p-0 text-[0.94rem] text-[#333333]">
          <span id="cb-number" class="zp-checkbox checked">
            <svg viewBox="0 0 12 12"><polyline points="2.2,6.2 5,9 9.8,3.2"/></svg>
          </span>
          <span>ナンバー</span>
        </button>
      </div>

      <!-- 3段目: 発生ボタン + 個数ボックス -->
      <div class="flex items-center gap-2.5 pt-1">
        <button type="button" id="btn-generate" class="zp-generate-btn">発生</button>
        <input type="number" id="input-count" value="1" min="1" max="6" class="zp-count-input" aria-label="発生数">
      </div>
    </section>

    <!-- 4. 中央広告スロット -->
    <div id="ad-mid" class="ad-slot-center"></div>

    <!-- エラー・注意メッセージ -->
    <div id="notice-box" class="hidden mb-4 px-3 py-2 rounded-md bg-amber-50 border border-amber-200 text-amber-800 text-xs text-center"></div>

    <!-- 5. 発生結果表示エリア -->
    <section id="result-area" class="mt-10 mb-16 min-h-[160px]"></section>

    <!-- 6. フッター -->
    <footer class="mt-10 pt-2 text-[0.82rem] leading-relaxed select-none">
      <div class="flex flex-wrap gap-x-2 gap-y-1 mb-2" id="footer-langs">
        <a data-lang="de" class="zp-footer-link">Deutsch</a>
        <a data-lang="en" class="zp-footer-link">English</a>
        <a data-lang="fr" class="zp-footer-link">Français</a>
        <a data-lang="es" class="zp-footer-link">Español</a>
        <a data-lang="pt" class="zp-footer-link">Português</a>
        <a data-lang="it" class="zp-footer-link">Italiano</a>
        <a data-lang="zh" class="zp-footer-link">中文</a>
        <a data-lang="ko" class="zp-footer-link">한국어</a>
      </div>
      <div class="text-[#333333]">
        <a data-info="usage" class="zp-footer-link">使い方</a>
        <span class="mx-1">–</span>
        <a data-info="contact" class="zp-footer-link">Contact us</a>
        <span class="mx-1">–</span>
        <a data-info="legal" class="zp-footer-link">Legal Notice</a>
        <span class="mx-1">–</span>
        <a data-info="privacy" class="zp-footer-link">Privacy Policy</a>
      </div>
    </footer>

    <!-- 7. フッター下部広告スロット（洗練された商用タイポグラフィバナーのみ） -->
    <div id="ad-bottom" class="ad-slot-bottom"></div>

  </div>

  <!-- ポケモン図鑑詳細モーダル -->
  <div id="detail-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl max-w-sm w-full p-5 shadow-2xl border border-gray-200" onclick="event.stopPropagation()">
      <div class="flex items-start justify-between pb-2.5 border-b border-gray-200">
        <div>
          <span id="detail-dex-num" class="text-xs font-mono text-gray-500">#000</span>
          <h3 id="detail-poke-name" class="text-lg font-bold text-[#2b6cb0]">ポケモン名</h3>
          <p id="detail-alt-names" class="text-[11px] text-gray-400 mt-0.5">-</p>
        </div>
        <button type="button" id="btn-close-detail" class="text-gray-400 hover:text-gray-700 text-xl font-bold px-1 cursor-pointer">&times;</button>
      </div>

      <div class="py-3 flex flex-col items-center">
        <div class="flex gap-2 mb-2">
          <button type="button" id="btn-detail-normal" class="px-3 py-1 text-xs font-semibold rounded-full bg-[#5a5a5a] text-white cursor-pointer">通常</button>
          <button type="button" id="btn-detail-shiny" class="px-3 py-1 text-xs font-semibold rounded-full bg-white text-gray-700 border border-gray-300 cursor-pointer">色違い</button>
        </div>
        <img id="detail-artwork" src="" alt="" class="w-40 h-40 object-contain my-1">
        <div id="detail-types" class="flex gap-1.5 mt-2"></div>
      </div>

      <div class="bg-gray-50 rounded-lg p-3 text-xs text-gray-700 space-y-2 border border-gray-100">
        <p id="detail-flavor" class="leading-relaxed">-</p>
        <div class="grid grid-cols-3 gap-2 pt-2 border-t border-gray-200 text-center">
          <div>
            <span class="block text-[10px] text-gray-400">分類</span>
            <span id="detail-genus" class="font-semibold">-</span>
          </div>
          <div>
            <span class="block text-[10px] text-gray-400">高さ</span>
            <span id="detail-height" class="font-semibold">-</span>
          </div>
          <div>
            <span class="block text-[10px] text-gray-400">重さ</span>
            <span id="detail-weight" class="font-semibold">-</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- フッター情報モーダル -->
  <div id="info-modal" class="fixed inset-0 bg-black/45 hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl max-w-sm w-full p-5 shadow-xl border border-gray-200" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between pb-2.5 border-b border-gray-200">
        <h3 id="info-modal-title" class="font-bold text-base text-[#2b6cb0]">使い方</h3>
        <button type="button" id="btn-close-info" class="text-gray-400 hover:text-gray-700 text-xl font-bold px-1 cursor-pointer">&times;</button>
      </div>
      <div id="info-modal-body" class="py-3 text-xs text-gray-700 leading-relaxed space-y-2"></div>
    </div>
  </div>

  <!-- ステルス仕込み設定モーダル（通常時は完全に非表示） -->
  <div id="secret-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl max-w-sm w-full p-5 shadow-2xl border border-gray-200" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between pb-3 border-b border-gray-200">
        <h3 class="font-bold text-base text-gray-800">特定ポケモン固定・ステルス設定</h3>
        <button type="button" id="btn-close-secret" class="text-gray-400 hover:text-gray-700 text-xl font-bold px-2 cursor-pointer">&times;</button>
      </div>

      <div class="py-4 space-y-4 text-sm max-h-[75vh] overflow-y-auto">
        <!-- デフォルト2回限定（御三家最終・準伝・伝説） -->
        <div class="bg-blue-50/70 border border-blue-200 rounded-lg p-3">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-gray-800">最初の2回限定（御三家最終・準伝・伝説）</span>
            <span id="starter-legend-badge" class="text-xs font-bold text-[#007bff]">ON（残り 2 回）</span>
          </div>
          <p class="text-[11px] text-gray-600 mt-1">
            ※タイトル上の広告タップでも即座に解除（残り0回）になります。
          </p>
          <div class="flex gap-2 mt-2">
            <button type="button" id="btn-reset-starter-legend" class="px-2.5 py-1 text-[11px] font-bold bg-white border border-blue-300 text-[#007bff] rounded cursor-pointer hover:bg-blue-50">
              残り2回にリセット
            </button>
            <button type="button" id="btn-disable-starter-legend" class="px-2.5 py-1 text-[11px] font-bold bg-white border border-gray-300 text-gray-600 rounded cursor-pointer hover:bg-gray-100">
              解除（0回にする）
            </button>
          </div>
        </div>

        <!-- 個別ポケモン指名固定 -->
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">個別ポケモン指名固定（日本語名 / 英語名 / 図鑑No.）</label>
          <div class="relative">
            <input type="text" id="secret-search-input" placeholder="例: ガケガニ、ピカチュウ、950..." class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:border-[#007bff] outline-none">
            <ul id="secret-suggest-list" class="hidden absolute left-0 right-0 bg-white border border-gray-300 rounded-lg shadow-lg mt-1 max-h-44 overflow-y-auto z-20"></ul>
          </div>
          <div id="secret-status-text" class="mt-1.5 text-xs font-bold text-[#007bff]">
            個別指名: なし
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1.5">個別指名の回数</label>
          <div class="space-y-1.5 text-xs">
            <label class="flex items-center gap-2 p-2 border rounded-lg cursor-pointer hover:bg-gray-50">
              <input type="radio" name="rig-freq" value="once" checked>
              <span>1回だけ固定（自動解除）</span>
            </label>
            <label class="flex items-center gap-2 p-2 border rounded-lg cursor-pointer hover:bg-gray-50">
              <input type="radio" name="rig-freq" value="always">
              <span>毎回固定</span>
            </label>
            <label class="flex items-center gap-2 p-2 border rounded-lg cursor-pointer hover:bg-gray-50">
              <input type="radio" name="rig-freq" value="off">
              <span>OFF（個別指名なし）</span>
            </label>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">名前の後ろに付ける文字（任意）</label>
          <input type="text" id="secret-suffix-input" placeholder="例: なし（空欄） または ?" class="w-full border border-gray-300 rounded-lg px-3 py-1.5 text-xs focus:border-[#007bff] outline-none">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1.5">広告枠の表示モード</label>
          <div class="space-y-1.5 text-xs">
            <label class="flex items-center gap-2 p-2 border rounded-lg cursor-pointer hover:bg-gray-50">
              <input type="radio" name="ad-style" value="dummy" checked>
              <span>ランダム広告表示（デフォルト）</span>
            </label>
            <label class="flex items-center gap-2 p-2 border rounded-lg cursor-pointer hover:bg-gray-50">
              <input type="radio" name="ad-style" value="blank">
              <span>非表示の空白マス</span>
            </label>
          </div>
        </div>
      </div>

      <div class="pt-3 border-t border-gray-200 flex items-center justify-between">
        <button type="button" id="btn-clear-rig" class="px-3 py-1.5 text-xs font-bold text-red-600 hover:bg-red-50 rounded-lg cursor-pointer">
          全仕込み解除
        </button>
        <button type="button" id="btn-save-rig" class="px-4 py-2 text-xs font-bold text-white bg-[#007bff] hover:bg-blue-600 rounded-lg shadow cursor-pointer">
          保存して閉じる
        </button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      // =========================================================================
      // 1. マスターデータ定義
      // =========================================================================
      const GEN_LIST = [
        { id: 1, label: '第一世代 (#1-151)', min: 1, max: 151 },
        { id: 2, label: '第二世代 (#152-251)', min: 152, max: 251 },
        { id: 3, label: '第三世代 (#252-386)', min: 252, max: 386 },
        { id: 4, label: '第四世代 (#387-493)', min: 387, max: 493 },
        { id: 5, label: '第五世代 (#394-649)', min: 494, max: 649 },
        { id: 6, label: '第六世代 (#650-721)', min: 650, max: 721 },
        { id: 7, label: '第七世代 (#722-809)', min: 722, max: 809 },
        { id: 8, label: '第八世代 (#810-905)', min: 810, max: 905 },
        { id: 9, label: '第九世代 (#906-1025)', min: 906, max: 1025 }
      ];

      const TYPE_LIST = [

      function preloadImage(url) {

          const img = new Image();
          img.onload = () => resolve(true);
          img.onerror = () => resolve(false);
          img.src = url;
          setTimeout(() => resolve(false), 1200);
        });
      }

      async function handleGenerateClick() {
        closeAllMenus();
        hideNotice();

        if (state.selectedGens.size === 0 || state.selectedTypes.size === 0) {
          showNotice('「世代」と「タイプ」をそれぞれ1つ以上選択してください。');
          return;
        }

        const countInput = document.getElementById('input-count');
        let count = parseInt(countInput.value, 10);
        if (isNaN(count) || count < 1) count = 1;
        if (count > 6) count = 6;
        countInput.value = count;

        const btn = document.getElementById('btn-generate');
        btn.disabled = true;

        // ボタン文言やスクロール位置は変えず、3つの広告枠のみ一瞬フラッシュしてリロードを再現
        const topAdEl = document.getElementById('ad-top');
        const midAdEl = document.getElementById('ad-mid');
        const botAdEl = document.getElementById('ad-bottom');
        if (state.adStyle === 'dummy') {
          if (topAdEl) topAdEl.classList.add('ad-reloading');
          if (midAdEl) midAdEl.classList.add('ad-reloading');
          if (botAdEl) botAdEl.classList.add('ad-reloading');
        }

        const reloadDelay = new Promise(resolve => setTimeout(resolve, 360));

        try {
          let candidateSet = new Set();
          state.selectedGens.forEach(genId => {
            const g = GEN_LIST.find(item => item.id === genId);
            if (g) {
              for (let i = g.min; i <= g.max; i++) candidateSet.add(i);
            }
          });

          if (state.selectedTypes.size < TYPE_LIST.length) {
            const typeUnion = new Set();
            await Promise.all(Array.from(state.selectedTypes).map(async (tEn) => {
              const ids = await fetchIdsForType(tEn);
              ids.forEach(id => typeUnion.add(id));
            }));
            candidateSet = new Set([...candidateSet].filter(id => typeUnion.has(id)));
          }

          let pool = Array.from(candidateSet);
          const picked = [];
          let forcedSuffix = '';

          // 1. 個別指名固定（最優先）
          if (rigConfig.active && rigConfig.id) {
            picked.push(rigConfig.id);
            forcedSuffix = rigConfig.suffix || '';
            pool = pool.filter(id => id !== rigConfig.id);

            if (rigConfig.freq === 'once') {
              resetRigStateOnly();
            }
            if (initialSpecialCount > 0) {
              initialSpecialCount--;
            }
          }
          // 2. デフォルト仕込み：最初の2回は御三家最終進化・準伝説・伝説からランダムに選出
          else if (initialSpecialCount > 0) {
            initialSpecialCount--;

            let specialPool = SPECIAL_DEFAULT_POOL.filter(id => candidateSet.has(id));
            if (specialPool.length === 0) {
              specialPool = [...SPECIAL_DEFAULT_POOL];
            }

            while (picked.length < count && specialPool.length > 0) {
              const idx = Math.floor(Math.random() * specialPool.length);
              const chosenId = specialPool.splice(idx, 1)[0];
              picked.push(chosenId);
              pool = pool.filter(id => id !== chosenId);
            }
          }

          // 残りの枠がある場合は通常のランダム抽出で埋める
          let guard = 0;
          while (picked.length < count && pool.length > 0 && guard < 80) {
            guard++;
            const idx = Math.floor(Math.random() * pool.length);
            const id = pool.splice(idx, 1)[0];

            if (state.evoFilter !== 'all') {
              const detail = await fetchPokemonDetail(id);
              if (!detail) continue;
              if (state.evoFilter === 'final' && detail.isFinal) picked.push(id);
              if (state.evoFilter === 'unevolved' && detail.isUnevolved) picked.push(id);
            } else {
              picked.push(id);
            }
          }

          if (picked.length === 0) {
            await reloadDelay;
            renderAds();
            if (topAdEl) topAdEl.classList.remove('ad-reloading');
            if (midAdEl) midAdEl.classList.remove('ad-reloading');
            if (botAdEl) botAdEl.classList.remove('ad-reloading');
            document.getElementById('result-area').innerHTML = '';
            showNotice('選択された条件に一致するポケモンが見つかりませんでした。');
            return;
          }

          const results = await Promise.all(picked.map((id, i) => fetchPokemonDetail(id, i === 0 ? forcedSuffix : '')));
          const validResults = results.filter(Boolean);

          await Promise.all([
            reloadDelay,
            ...validResults.map(p => preloadImage(p.artwork))
          ]);

          renderAds();
          if (topAdEl) topAdEl.classList.remove('ad-reloading');
          if (midAdEl) midAdEl.classList.remove('ad-reloading');
          if (botAdEl) botAdEl.classList.remove('ad-reloading');

          lastGenerated = validResults;
          renderResultCards();
        } catch (err) {
          if (topAdEl) topAdEl.classList.remove('ad-reloading');
          if (midAdEl) midAdEl.classList.remove('ad-reloading');
          if (botAdEl) botAdEl.classList.remove('ad-reloading');
          document.getElementById('result-area').innerHTML = '';
          showNotice('データの読み込み中にエラーが発生しました。再度お試しください。');
        } finally {
          btn.disabled = false;
        }
      }

      async function fetchIdsForType(typeEn) {
        if (typeCache[typeEn]) return typeCache[typeEn];
        const res = await fetch(`https://pokeapi.co/api/v2/type/${typeEn}`);
        const data = await res.json();
        const ids = data.pokemon
          .map(p => {
            const m = p.pokemon.url.match(/\/pokemon\/(\d+)\//);
            return m ? parseInt(m[1], 10) : null;
          })
          .filter(id => id && id <= 1025);
        typeCache[typeEn] = ids;
        return ids;
      }

      function buildFallbackSvgDataUrl(id) {
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240"><circle cx="120" cy="120" r="96" fill="#f3f4f6" stroke="#d1d5db" stroke-width="4"/><path d="M24 120 H216" stroke="#9ca3af" stroke-width="6"/><circle cx="120" cy="120" r="24" fill="#ffffff" stroke="#9ca3af" stroke-width="6"/><text x="120" y="185" font-family="sans-serif" font-size="18" font-weight="bold" fill="#6b7280" text-anchor="middle">#${id}</text></svg>`;
        return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);
      }

      async function fetchPokemonDetail(id, customSuffix = '') {
        if (pokemonCache[id]) {
          return { ...pokemonCache[id], customSuffix };
        }

        const builtin = BUILTIN_SPECIES.find(s => s.id === id);

        try {
          const [pokeRes, speciesRes] = await Promise.all([
            fetch(`https://pokeapi.co/api/v2/pokemon/${id}`),
            fetch(`https://pokeapi.co/api/v2/pokemon-species/${id}`)
          ]);
          const poke = await pokeRes.json();
          const species = await speciesRes.json();

          const names = {};
          species.names.forEach(n => { names[n.language.name] = n.name; });
          if (!names['ja'] && names['ja-Hrkt']) names['ja'] = names['ja-Hrkt'];
          if (!names['ja-Hrkt'] && names['ja']) names['ja-Hrkt'] = names['ja'];
          if (builtin && !names['ja-Hrkt']) names['ja-Hrkt'] = builtin.ja;

          const jaFlavor = species.flavor_text_entries.find(f => f.language.name === 'ja' || f.language.name === 'ja-Hrkt');
          const enFlavor = species.flavor_text_entries.find(f => f.language.name === 'en');
          const flavor = (jaFlavor ? jaFlavor.flavor_text : (enFlavor ? enFlavor.flavor_text : '')).replace(/[\n\f\r]/g, ' ');

          const jaGenus = species.genera.find(g => g.language.name === 'ja' || g.language.name === 'ja-Hrkt');
          const genus = jaGenus ? jaGenus.genus : '-';

          const types = poke.types.sort((a, b) => a.slot - b.slot).map(t => t.type.name);
          const isUnevolved = !species.evolves_from_species;

          let isFinal = true;
          try {
            if (species.evolution_chain && species.evolution_chain.url) {
              const evoRes = await fetch(species.evolution_chain.url);
              const evoJson = await evoRes.json();
              const resFinal = checkFinalInChain(evoJson.chain, species.name);
              if (resFinal !== null) isFinal = resFinal;
            }
          } catch (e) {}

          const detail = {
            id,
            names,
            types,
            flavor,
            genus,
            height: (poke.height / 10).toFixed(1) + ' m',
            weight: (poke.weight / 10).toFixed(1) + ' kg',
            isFinal,
            isUnevolved,
            artwork: `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`,
            fallbackSvg: buildFallbackSvgDataUrl(id),
            shinyArtwork: `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/shiny/${id}.png`
          };

          pokemonCache[id] = detail;
          return { ...detail, customSuffix };
        } catch (e) {
          const fallback = {
            id,
            names: {
              'ja-Hrkt': builtin ? builtin.ja : `ポケモン #${id}`,
              'en': builtin ? builtin.en : `Pokemon #${id}`
            },
            types: ['normal'],
            flavor: '図鑑データを取得できませんでした。',
            genus: '-',
            height: '-',
            weight: '-',
            isFinal: true,
            isUnevolved: true,
            artwork: `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`,
            fallbackSvg: buildFallbackSvgDataUrl(id),
            shinyArtwork: `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/shiny/${id}.png`
          };
          return { ...fallback, customSuffix };
        }
      }

      function checkFinalInChain(node, targetName) {
        if (node.species.name === targetName) return node.evolves_to.length === 0;
        for (const child of node.evolves_to) {
          const res = checkFinalInChain(child, targetName);
          if (res !== null) return res;
        }
        return null;
      }

      function getNameInSelectedLang(p) {
        const langObj = NAME_LANGS.find(l => l.key === state.nameLang) || NAME_LANGS[0];
        const base = p.names[langObj.api] || p.names['ja-Hrkt'] || p.names['en'] || `#${p.id}`;
        return base + (p.customSuffix || '');
      }

      function getTypeLabelInSelectedLang(typeEn) {
        const t = TYPE_LIST.find(item => item.en === typeEn);
        if (!t) return typeEn;
        return t[state.nameLang] || t.ja;
      }

      function renderResultCards() {
        const area = document.getElementById('result-area');
        if (!area) return;

        if (!lastGenerated || lastGenerated.length === 0) {
          area.innerHTML = '';
          return;
        }

        if (lastGenerated.length === 1) {
          const p = lastGenerated[0];
          const name = getNameInSelectedLang(p);
          const label = state.showNumber ? `#${p.id} ${name}` : name;

          area.innerHTML = `
            <div data-detail-id="${p.id}" class="result-reveal cursor-pointer">
              ${state.showImage ? `
                <div class="w-full flex justify-center my-2">
                  <img src="${p.artwork}" alt="${name}" class="w-[245px] h-[245px] object-contain" onerror="this.onerror=null;this.src='${p.fallbackSvg}'">
                </div>
              ` : ''}
              <div class="mt-3 text-[0.98rem] text-[#333333] font-normal tracking-tight">
                ${label}
              </div>
            </div>
          `;
          return;
        }

        area.innerHTML = `
          <div class="grid grid-cols-2 gap-x-4 gap-y-6">
            ${lastGenerated.map(p => {
              const name = getNameInSelectedLang(p);
              const label = state.showNumber ? `#${p.id} ${name}` : name;
              return `
                <div data-detail-id="${p.id}" class="result-reveal cursor-pointer flex flex-col">
                  ${state.showImage ? `
                    <div class="w-full flex justify-center my-1">
                      <img src="${p.artwork}" alt="${name}" class="w-36 h-36 object-contain" onerror="this.onerror=null;this.src='${p.fallbackSvg}'">
                    </div>
                  ` : ''}
                  <div class="mt-1.5 text-[0.9rem] text-[#333333]">
                    ${label}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }

      // =========================================================================
      // 5. 詳細モーダル & フッターモーダル
      // =========================================================================
      async function openDetailModal(id) {
        const data = await fetchPokemonDetail(id);
        if (!data) return;
        currentDetailData = data;

        document.getElementById('detail-dex-num').textContent = `#${data.id}`;
        document.getElementById('detail-poke-name').textContent = getNameInSelectedLang(data);
        document.getElementById('detail-alt-names').textContent = `日本語: ${data.names['ja-Hrkt'] || '-'} / English: ${data.names['en'] || '-'}`;
        document.getElementById('detail-types').innerHTML = data.types
          .map(tEn => `<span class="type-pill type-${tEn}">${getTypeLabelInSelectedLang(tEn)}</span>`)
          .join('');

        setDetailShiny(false);
        document.getElementById('detail-flavor').textContent = data.flavor || '図鑑説明がありません。';
        document.getElementById('detail-genus').textContent = data.genus;
        document.getElementById('detail-height').textContent = data.height;
        document.getElementById('detail-weight').textContent = data.weight;

        const modal = document.getElementById('detail-modal');
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      }

      function setDetailShiny(isShiny) {
        if (!currentDetailData) return;
        const img = document.getElementById('detail-artwork');
        const btnN = document.getElementById('btn-detail-normal');
        const btnS = document.getElementById('btn-detail-shiny');

        if (isShiny) {
          img.src = currentDetailData.shinyArtwork;
          btnS.className = 'px-3 py-1 text-xs font-semibold rounded-full bg-amber-500 text-white cursor-pointer';
          btnN.className = 'px-3 py-1 text-xs font-semibold rounded-full bg-white text-gray-700 border border-gray-300 cursor-pointer';
        } else {
          img.src = currentDetailData.artwork;
          btnN.className = 'px-3 py-1 text-xs font-semibold rounded-full bg-[#5a5a5a] text-white cursor-pointer';
          btnS.className = 'px-3 py-1 text-xs font-semibold rounded-full bg-white text-gray-700 border border-gray-300 cursor-pointer';
        }
      }

      function closeDetailModal() {
        const modal = document.getElementById('detail-modal');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }

      function openInfoModal(type) {
        const titleEl = document.getElementById('info-modal-title');
        const bodyEl = document.getElementById('info-modal-body');

        if (type === 'usage') {
          titleEl.textContent = '使い方';
          bodyEl.innerHTML = `
            <p>「世代」「タイプ」「進化」などの条件を選択し、青い「発生」ボタンを押すとランダムにポケモンが表示されます。</p>
            <p>横の数字ボックスを変更すると、一度に1〜6匹まで発生させることができます。</p>
            <p>「画像」「ナンバー」のチェックボックスや「名前」の言語設定は、発生後でもリアルタイムで切り替え可能です。</p>
          `;
        } else {
          titleEl.textContent = type === 'contact' ? 'Contact us' : type === 'legal' ? 'Legal Notice' : 'Privacy Policy';
          bodyEl.innerHTML = `
            <p>Pokémon and Pokémon character names are trademarks of Nintendo / Creatures Inc. / GAME FREAK inc.</p>
            <p>Data provided by PokéAPI.</p>
          `;
        }

        const modal = document.getElementById('info-modal');
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      }

      function closeInfoModal() {
        const modal = document.getElementById('info-modal');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }

      // =========================================================================
      // 6. ステルス仕込み機能（タイトル3回タップ / 1.2秒長押し / Shift+P / 広告タップ解除）
      // =========================================================================
      function toKatakana(str) {
        return str.replace(/[\u3041-\u3096]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60));
      }

      function loadRigFromStorage() {
        try {
          const raw = localStorage.getItem(RIG_STORAGE_KEY);
          if (raw) {
            const saved = JSON.parse(raw);
            if (saved) {
              if (saved.adStyle) state.adStyle = saved.adStyle;
              if (saved.active && saved.id) {
                rigConfig = saved;
              }
            }
          }
        } catch (e) {}
      }

      function applyUrlQueryRig() {
        const params = new URLSearchParams(window.location.search);
        const fix = params.get('fix') || params.get('pokemon');
        const idStr = params.get('id');
        const freq = params.get('freq') === 'always' ? 'always' : 'once';
        const suffix = params.get('suffix') || '';

        if (idStr) {
          const num = parseInt(idStr, 10);
          if (num >= 1 && num <= 1025) {
            const found = speciesList.find(s => s.id === num);
            rigConfig = { active: true, id: num, name: found ? found.ja : `No.${num}`, freq, suffix };
          }
        } else if (fix) {
          const qKata = toKatakana(fix.trim());
          const found = speciesList.find(s =>
            toKatakana(s.ja) === qKata ||
            s.en.toLowerCase() === fix.trim().toLowerCase() ||
            toKatakana(s.ja).includes(qKata)
          );
          if (found) {
            rigConfig = { active: true, id: found.id, name: found.ja, freq, suffix };
          }
        }
      }

      function openSecretModal() {
        syncSecretModal();
        const modal = document.getElementById('secret-modal');
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      }

      function closeSecretModal() {
        const modal = document.getElementById('secret-modal');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
        document.getElementById('secret-suggest-list').classList.add('hidden');
      }

      function syncSecretModal() {
        const status = document.getElementById('secret-status-text');
        const input = document.getElementById('secret-search-input');
        const suffixInput = document.getElementById('secret-suffix-input');
        const badgeEl = document.getElementById('starter-legend-badge');

        if (badgeEl) {
          badgeEl.textContent = initialSpecialCount > 0
            ? `ON（残り ${initialSpecialCount} 回）`
            : 'OFF（解除済み）';
          badgeEl.className = initialSpecialCount > 0
            ? 'text-xs font-bold text-[#007bff]'
            : 'text-xs font-bold text-gray-500';
        }

        document.querySelectorAll('input[name="ad-style"]').forEach(r => {
          r.checked = (r.value === state.adStyle);
        });

        const targetFreq = rigConfig.active ? rigConfig.freq : 'once';
        document.querySelectorAll('input[name="rig-freq"]').forEach(r => {
          r.checked = (r.value === targetFreq);
        });

        if (rigConfig.active && rigConfig.id) {
          const freqTxt = rigConfig.freq === 'once' ? '1回のみ' : '毎回固定';
          status.textContent = `個別指名: #${rigConfig.id} ${rigConfig.name}（${freqTxt}）`;
          input.value = rigConfig.name;
          suffixInput.value = rigConfig.suffix || '';
          pendingRigCandidate = { id: rigConfig.id, name: rigConfig.name };
        } else {
          status.textContent = '個別指名: なし';
          input.value = '';
          suffixInput.value = '';
          pendingRigCandidate = null;
        }
      }

      function onSecretSearchInput() {
        const val = document.getElementById('secret-search-input').value.trim();
        const list = document.getElementById('secret-suggest-list');
        if (!val) {
          list.classList.add('hidden');
          pendingRigCandidate = null;
          return;
        }

        let matches = [];
        if (/^\d+$/.test(val)) {
          const num = parseInt(val, 10);
          if (num >= 1 && num <= 1025) {
            const found = speciesList.find(s => s.id === num);
            matches = found ? [found] : [{ id: num, ja: `ポケモン No.${num}`, en: '' }];
          }
        } else {
          const qKata = toKatakana(val);
          const qLow = val.toLowerCase();
          matches = speciesList.filter(s =>
            toKatakana(s.ja).includes(qKata) || s.en.toLowerCase().includes(qLow)
          ).slice(0, 15);
        }

        if (matches.length === 0) {
          list.innerHTML = '<li class="px-3 py-2 text-xs text-gray-400">一致するポケモンが見つかりません（図鑑No. 1〜1025 でも直接指定できます）</li>';
        } else {
          list.innerHTML = matches.map(m => `
            <li data-cand-id="${m.id}" data-cand-name="${m.ja}" class="px-3 py-2 hover:bg-blue-50 cursor-pointer flex items-center justify-between border-b border-gray-100 last:border-none">
              <span class="font-bold text-xs text-gray-800">${m.ja} <span class="text-gray-400 font-normal">${m.en ? `(${m.en})` : ''}</span></span>
              <span class="font-mono text-xs text-gray-400">#${m.id}</span>
            </li>
          `).join('');
        }
        list.classList.remove('hidden');
      }

      function saveRigConfig() {
        const raw = document.getElementById('secret-search-input').value.trim();
        const freqEl = document.querySelector('input[name="rig-freq"]:checked');
        const freq = freqEl ? freqEl.value : 'once';
        const suffix = document.getElementById('secret-suffix-input').value;
        const adEl = document.querySelector('input[name="ad-style"]:checked');
        const adStyle = adEl ? adEl.value : 'dummy';

        state.adStyle = adStyle;
        renderAds();

        if (!pendingRigCandidate && raw) {
          if (/^\d+$/.test(raw)) {
            const num = parseInt(raw, 10);
            if (num >= 1 && num <= 1025) {
              const found = speciesList.find(s => s.id === num);
              pendingRigCandidate = { id: num, name: found ? found.ja : `No.${num}` };
            }
          } else {
            const qKata = toKatakana(raw);
            const found = speciesList.find(s => toKatakana(s.ja) === qKata) ||
                          speciesList.find(s => toKatakana(s.ja).includes(qKata));
            if (found) pendingRigCandidate = { id: found.id, name: found.ja };
          }
        }

        if (pendingRigCandidate && freq !== 'off') {
          rigConfig = {
            active: true,
            id: pendingRigCandidate.id,
            name: pendingRigCandidate.name,
            freq,
            suffix
          };
        } else {
          rigConfig = { active: false, id: null, name: '', freq: 'once', suffix: '' };
        }

        try {
          localStorage.setItem(RIG_STORAGE_KEY, JSON.stringify({ ...rigConfig, adStyle: state.adStyle }));
        } catch (e) {}
        closeSecretModal();
      }

      function resetRigStateOnly() {
        rigConfig = { active: false, id: null, name: '', freq: 'once', suffix: '' };
        pendingRigCandidate = null;
        try {
          localStorage.setItem(RIG_STORAGE_KEY, JSON.stringify({ ...rigConfig, adStyle: state.adStyle }));
        } catch (e) {}
      }

      function clearRigConfig() {
        initialSpecialCount = 0;
        resetRigStateOnly();
        syncSecretModal();
        closeSecretModal();
      }

      function showNotice(msg) {
        const box = document.getElementById('notice-box');
        if (box) {
          box.textContent = msg;
          box.classList.remove('hidden');
        }
      }

      function hideNotice() {
        const box = document.getElementById('notice-box');
        if (box) box.classList.add('hidden');
      }

      // =========================================================================
      // 7. 全イベントリスナー登録 & 確実な初期化
      // =========================================================================
      function bindEvents() {
        // タイトル上の広告タップで「最初の2回（御三家最終・準伝・伝説）」を無言解除
        const topAdEl = document.getElementById('ad-top');
        if (topAdEl) {
          topAdEl.addEventListener('click', () => {
            if (initialSpecialCount > 0) {
              initialSpecialCount = 0;
            }
          });
        }

        document.getElementById('btn-opt-image').addEventListener('click', () => {
          state.showImage = !state.showImage;
          document.getElementById('cb-image').classList.toggle('checked', state.showImage);
          renderResultCards();
        });

        document.getElementById('btn-opt-number').addEventListener('click', () => {
          state.showNumber = !state.showNumber;
          document.getElementById('cb-number').classList.toggle('checked', state.showNumber);
          renderResultCards();
        });

        ['gen', 'type', 'name', 'evo'].forEach(key => {
          document.getElementById(`btn-${key}`).addEventListener('click', (e) => {
            e.stopPropagation();
            toggleMenu(key);
          });
        });

        document.getElementById('list-gen').addEventListener('click', (e) => {
          const item = e.target.closest('[data-gen-id]');
          if (!item) return;
          const id = parseInt(item.getAttribute('data-gen-id'), 10);
          if (state.selectedGens.has(id)) state.selectedGens.delete(id);
          else state.selectedGens.add(id);
          renderDropdownLists();
        });

        document.getElementById('btn-gen-all').addEventListener('click', () => {
          if (state.selectedGens.size === GEN_LIST.length) state.selectedGens.clear();
          else GEN_LIST.forEach(g => state.selectedGens.add(g.id));
          renderDropdownLists();
        });

        document.getElementById('list-type').addEventListener('click', (e) => {
          const item = e.target.closest('[data-type-en]');
          if (!item) return;
          const en = item.getAttribute('data-type-en');
          if (state.selectedTypes.has(en)) state.selectedTypes.delete(en);
          else state.selectedTypes.add(en);
          renderDropdownLists();
        });

        document.getElementById('btn-type-all').addEventListener('click', () => {
          if (state.selectedTypes.size === TYPE_LIST.length) state.selectedTypes.clear();
          else TYPE_LIST.forEach(t => state.selectedTypes.add(t.en));
          renderDropdownLists();
        });

        document.getElementById('list-name').addEventListener('click', (e) => {
          const item = e.target.closest('[data-lang-key]');
          if (!item) return;
          state.nameLang = item.getAttribute('data-lang-key');
          renderDropdownLists();
          closeAllMenus();
          renderResultCards();
        });

        document.getElementById('list-evo').addEventListener('click', (e) => {
          const item = e.target.closest('[data-evo-key]');
          if (!item) return;
          state.evoFilter = item.getAttribute('data-evo-key');
          renderDropdownLists();
          closeAllMenus();
        });

        document.addEventListener('click', (e) => {
          if (!state.openMenu) return;
          const wrap = document.getElementById(`wrap-${state.openMenu}`);
          if (wrap && !wrap.contains(e.target)) {
            closeAllMenus();
          }
        });

        document.getElementById('btn-generate').addEventListener('click', handleGenerateClick);

        document.getElementById('result-area').addEventListener('click', (e) => {
          const card = e.target.closest('[data-detail-id]');
          if (card) {
            const id = parseInt(card.getAttribute('data-detail-id'), 10);
            openDetailModal(id);
          }
        });

        document.getElementById('footer-langs').addEventListener('click', (e) => {
          const link = e.target.closest('[data-lang]');
          if (!link) return;
          const lang = link.getAttribute('data-lang');
          if (NAME_LANGS.some(l => l.key === lang)) {
            state.nameLang = lang;
            renderDropdownLists();
            renderResultCards();
          }
        });

        document.querySelectorAll('[data-info]').forEach(el => {
          el.addEventListener('click', () => openInfoModal(el.getAttribute('data-info')));
        });

        document.getElementById('detail-modal').addEventListener('click', closeDetailModal);
        document.getElementById('btn-close-detail').addEventListener('click', closeDetailModal);
        document.getElementById('btn-detail-normal').addEventListener('click', () => setDetailShiny(false));
        document.getElementById('btn-detail-shiny').addEventListener('click', () => setDetailShiny(true));

        document.getElementById('info-modal').addEventListener('click', closeInfoModal);
        document.getElementById('btn-close-info').addEventListener('click', closeInfoModal);

        // ステルス仕込み設定トリガー（タイトル3回タップ / 1.2秒長押し / Shift+P）
        const titleEl = document.getElementById('secret-title-trigger');
        let tapCount = 0;
        let tapTimer = null;
        let holdTimer = null;

        titleEl.addEventListener('click', () => {
          tapCount++;
          clearTimeout(tapTimer);
          if (tapCount >= 3) {
            tapCount = 0;
            openSecretModal();
          } else {
            tapTimer = setTimeout(() => { tapCount = 0; }, 600);
          }
        });

        titleEl.addEventListener('touchstart', () => {
          holdTimer = setTimeout(() => { openSecretModal(); }, 1200);
        }, { passive: true });
        titleEl.addEventListener('touchend', () => clearTimeout(holdTimer));
        titleEl.addEventListener('mousedown', () => {
          holdTimer = setTimeout(() => { openSecretModal(); }, 1200);
        });
        titleEl.addEventListener('mouseup', () => clearTimeout(holdTimer));

        document.addEventListener('keydown', (e) => {
          if (e.shiftKey && (e.key === 'P' || e.key === 'p')) {
            if (document.activeElement && document.activeElement.tagName !== 'INPUT') {
              e.preventDefault();
              openSecretModal();
            }
          }
        });

        document.getElementById('secret-modal').addEventListener('click', closeSecretModal);
        document.getElementById('btn-close-secret').addEventListener('click', closeSecretModal);
        document.getElementById('secret-search-input').addEventListener('input', onSecretSearchInput);
        document.getElementById('secret-suggest-list').addEventListener('click', (e) => {
          const item = e.target.closest('[data-cand-id]');
          if (!item) return;
          const id = parseInt(item.getAttribute('data-cand-id'), 10);
          const name = item.getAttribute('data-cand-name');
          pendingRigCandidate = { id, name };
          document.getElementById('secret-search-input').value = name;
          document.getElementById('secret-suggest-list').classList.add('hidden');
          document.getElementById('secret-status-text').textContent = `選択候補: #${id} ${name}`;
        });

        document.getElementById('btn-reset-starter-legend').addEventListener('click', () => {
          initialSpecialCount = 2;
          syncSecretModal();
        });
        document.getElementById('btn-disable-starter-legend').addEventListener('click', () => {
          initialSpecialCount = 0;
          syncSecretModal();
        });

        document.getElementById('btn-save-rig').addEventListener('click', saveRigConfig);
        document.getElementById('btn-clear-rig').addEventListener('click', clearRigConfig);
      }

      function init() {
        loadRigFromStorage();
        applyUrlQueryRig();
        renderDropdownLists();
        renderAds();
        bindEvents();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
